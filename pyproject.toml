[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-search-mcp-server"
version = "0.2.0"
description = "Cursor/Ubuntu stdio MCP (paperSearch) for academic paper search and literature surveys."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.27.0,<2",
  "httpx>=0.28.1",
  "feedparser>=6.0.12",
  "pypdf>=5.4.0",
]

[project.scripts]
paper-search-mcp = "academic_mcp_server.survey.mcp:main"
academic-mcp-server = "academic_mcp_server.server:main"
survey-cli = "academic_mcp_server.survey.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]